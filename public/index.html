<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Audioanalyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="header-row">
    <h1>Audio analyzer</h1>
    <label for="lang-switcher" class="visually-hidden" data-i18n="common.language">Language</label>
    <select id="lang-switcher">
      <option value="sv">Svenska</option>
      <option value="en">English</option>
    </select>
  </div>

  <form id="analyze-form">
    <label for="url-input" class="visually-hidden" data-i18n="nav.urlLabel">Ström-URL</label>
    <input
      type="url"
      id="url-input"
      data-i18n-placeholder="nav.urlPlaceholder"
      placeholder="Ström-URL – HLS, DASH eller Icecast/radio"
      required
    />
    <button type="submit" id="analyze-btn" data-i18n="nav.analyzeBtn">Analysera</button>
    <button type="button" id="log-btn" data-i18n="nav.logBtn" data-i18n-title="nav.logBtnTitle" title="Följ strömmen över tid i stället för att ta en ögonblicksbild">Logga</button>
  </form>

  <p id="file-row">
    <span data-i18n="nav.fileRowPrefix">eller analysera en ljudfil:</span>
    <label for="file-input" id="file-pick" data-i18n="nav.filePick">Välj ljudfil…</label>
    <input
      type="file"
      id="file-input"
      class="visually-hidden"
      accept="audio/*,.wav,.flac,.mp3,.m4a,.aac,.ogg,.opus,.aiff,.wma,video/*,.mp4,.m4v,.mov,.mkv,.webm"
    />
    <span id="file-name"></span>
  </p>

  <details id="faq">
    <summary data-i18n="faq.summary">Om verktyget</summary>

    <p data-i18n-html="faq.intro"></p>

    <details>
      <summary data-i18n-html="faq.hlsSummary"></summary>
      <p data-i18n-html="faq.hlsBody"></p>
    </details>

    <details>
      <summary data-i18n-html="faq.dashSummary"></summary>
      <p data-i18n-html="faq.dashBody"></p>
    </details>

    <details>
      <summary data-i18n-html="faq.icecastSummary"></summary>
      <p data-i18n-html="faq.icecastBody1"></p>
      <p data-i18n-html="faq.icecastBody2"></p>
      <p data-i18n-html="faq.icecastBody3"></p>
    </details>

    <details>
      <summary data-i18n-html="faq.fileSummary"></summary>
      <p data-i18n-html="faq.fileBody1"></p>
      <p data-i18n="faq.fileBody2"></p>
    </details>

    <details>
      <summary data-i18n-html="faq.loggingSummary"></summary>
      <p data-i18n-html="faq.loggingBody1"></p>
      <p data-i18n-html="faq.loggingBody2"></p>
      <p data-i18n-html="faq.loggingBody3"></p>
    </details>

    <details>
      <summary data-i18n-html="faq.whyFailsSummary"></summary>
      <p data-i18n-html="faq.whyFailsBody"></p>
    </details>
  </details>

  <p id="analyzed-url-info" hidden></p>
  <p id="status"></p>

  <div id="results"></div>

  <footer id="site-footer">
    Zakarias Faust ·
    <a href="https://www.soundevent.se" target="_blank" rel="noopener">soundevent.se</a> ·
    <a href="https://github.com/zakariasfaust/audio-analyzer" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="i18n.js"></script>
  <script src="i18n/sv.js"></script>
  <script src="i18n/en.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script src="log.js"></script>
  <script src="file.js"></script>
</body>
</html>
