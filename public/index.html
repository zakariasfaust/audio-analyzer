<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Audio-analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="header-row">
    <h1>Audio-analyzer</h1>
    <button type="button" id="copy-btn" title="Kopiera all analysdata (utom råmanifestet) som text, t.ex. för att klistra in i en AI-tjänst" disabled>Kopiera analys</button>
  </div>

  <form id="analyze-form">
    <label for="url-input" class="visually-hidden">Ström-URL</label>
    <input
      type="url"
      id="url-input"
      placeholder="Klistra in en ström-URL här - HLS (.m3u8), DASH (.mpd) eller Icecast/radio (SHOUTcast, RSAS)"
      required
    />
    <button type="submit" id="analyze-btn">Analysera</button>
  </form>

  <p id="analyzed-url-info" hidden></p>
  <p id="status"></p>

  <div id="results"></div>

  <footer id="site-footer">
    <a href="https://github.com/zakariasfaust/audio-analyzer" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="terms.js"></script>
  <script src="app.js"></script>
</body>
</html>
